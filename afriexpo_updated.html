// ─── Firebase helpers ─────────────────────────────────────────
const db = () => window._db
const auth = () => window._auth
const ts = () => window._ts ? window._ts() : new Date().toISOString()

const col = (name) => db()?.collection(name)
const docRef = (col, id) => db()?.collection(col).doc(id)
const addDoc = async (colName, data) => db()?.collection(colName).add(data)
const setDoc = async (colName, id, data) => db()?.collection(colName).doc(id).set(data)
const getDoc = async (colName, id) => {
  const snap = await db()?.collection(colName).doc(id).get()
  return snap?.exists ? { id: snap.id, ...snap.data() } : null
}
const getDocs = async (colName, constraints = []) => {
  let ref = db()?.collection(colName)
  constraints.forEach(c => {
    if (c.type === 'where') ref = ref?.where(c.f, c.op, c.v)
    if (c.type === 'orderBy') ref = ref?.orderBy(c.f, c.dir || 'asc')
    if (c.type === 'limit') ref = ref?.limit(c.n)
  })
  const snap = await ref?.get()
  return snap?.docs.map(d => ({ id: d.id, ...d.data() })) || []
}
const updateDoc = async (colName, id, data) => db()?.collection(colName).doc(id).update(data)
const deleteDoc = async (colName, id) => db()?.collection(colName).doc(id).delete()
const onSnap = (colName, constraints, cb) => {
  let ref = db()?.collection(colName)
  constraints.forEach(c => {
    if (c.type === 'where') ref = ref?.where(c.f, c.op, c.v)
    if (c.type === 'orderBy') ref = ref?.orderBy(c.f, c.dir || 'asc')
    if (c.type === 'limit') ref = ref?.limit(c.n)
  })
  return ref?.onSnapshot(snap => cb(snap?.docs.map(d => ({ id: d.id, ...d.data() })) || []))
}

// ─── AUTH ─────────────────────────────────────────────────────
function AuthPage({ onAuth }) {
  const [mode, setMode] = useState("login")
  const [form, setForm] = useState({ email:"", password:"", name:"", company:"", role:"exhibitor" })
  const [err, setErr] = useState("")
  const [loading, setLoading] = useState(false)
  const set = (k,v) => setForm(f=>({...f,[k]:v}))

  const errMap = {
    "auth/email-already-in-use":"An account with this email already exists.",
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/weak-password":"Password must be at least 6 characters.",
    "auth/user-not-found":"No account found with this email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Invalid email or password.",
    "auth/too-many-requests":"Too many attempts. Try again later.",
    "auth/network-request-failed":"Network error. Check your connection.",
  }

  const submit = async () => {
    setErr(""); setLoading(true)
    const a = auth(); const d = db()
    if (!a || !d) { setErr("Firebase not loaded. Please wait."); setLoading(false); return }
    try {
      if (mode === "login") {
        const cred = await a.signInWithEmailAndPassword(form.email, form.password)
        const snap = await d.collection("users").doc(cred.user.uid).get()
        const p = snap.exists ? snap.data() : {}
        onAuth({ id:cred.user.uid, name:p.name||cred.user.displayName||form.email.split("@")[0], email:cred.user.email, role:p.role||"visitor", company:p.company||"", avatar:p.avatar||(p.name||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(), verified:p.verified||false, country:p.country||"", bio:p.bio||"", phone:p.phone||"", website:p.website||"", category:p.category||"", products:p.products||[], tags:p.tags||[], description:p.description||"", seeking:p.seeking||"" })
      } else {
        if (!form.name||!form.email||!form.password) { setErr("All fields are required"); setLoading(false); return }
        if (form.password.length<6) { setErr("Password must be at least 6 characters"); setLoading(false); return }
        const cred = await a.createUserWithEmailAndPassword(form.email, form.password)
        await cred.user.updateProfile({ displayName: form.name })
        const av = form.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()
        const prof = { id:cred.user.uid, name:form.name, email:form.email, role:form.role, company:form.company||"", avatar:av, verified:false, country:"", bio:"", phone:"", website:"", category:"", products:[], tags:[], description:"", seeking:"", createdAt:ts() }
        await d.collection("users").doc(cred.user.uid).set(prof)
        onAuth({ ...prof })
      }
    } catch(e) { setErr(errMap[e.code]||e.message||"Something went wrong.") }
    setLoading(false)
  }

  const googleSign = async () => {
    setErr(""); setLoading(true)
    const a = auth(); const d = db()
    if (!a||!d) { setErr("Firebase not ready"); setLoading(false); return }
    try {
      const r = await a.signInWithPopup(window._googleProvider)
      const snap = await d.collection("users").doc(r.user.uid).get()
      let p = snap.exists ? snap.data() : null
      if (!p) {

// ─── NOTIFICATIONS ────────────────────────────────────────────
function NotifPanel({ user, onClose }) {
  const [notifs, setNotifs] = useState([])
  const imap = { match:"zap", message:"msg", meeting:"calendar", inquiry:"package", system:"check" }

  useEffect(() => {
    if (!user?.id || user.isGuest) return
    const unsub = onSnap("notifications",
      [{type:"where",f:"userId",op:"==",v:user.id},{type:"orderBy",f:"createdAt",dir:"desc"},{type:"limit",n:20}],
      docs => setNotifs(docs)
    )
    return () => unsub?.()
  }, [user?.id])

  const markRead = async (id) => {
    await updateDoc("notifications", id, { read: true }).catch(()=>{})
    setNotifs(n=>n.map(x=>x.id===id?{...x,read:true}:x))
  }
  const markAll = async () => {
    for (const n of notifs.filter(x=>!x.read)) await updateDoc("notifications", n.id, {read:true}).catch(()=>{})
    setNotifs(n=>n.map(x=>({...x,read:true})))
  }
  const unread = notifs.filter(n=>!n.read).length

  return (
    <div style={{position:"fixed",top:64,right:16,width:340,zIndex:60,animation:"fup .2s ease both"}}>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",borderBottom:"1px solid rgba(69,48,13,.35)"}}>
          <span style={{fontWeight:600,color:"#E8DCC8",fontSize:14}}>Notifications {unread>0&&<span style={{color:"#FF9A1A",fontSize:12}}>({unread})</span>}</span>
          <div style={{display:"flex",gap:8}}>
            {unread>0&&<button onClick={markAll} style={{color:"#9A7540",fontSize:11,background:"none",border:"none",cursor:"pointer"}}>Mark all read</button>}
            <button onClick={onClose} style={{color:"#614518",background:"none",border:"none",cursor:"pointer"}}><Icon name="x" size={14}/></button>
          </div>
        </div>
        <div style={{maxHeight:360,overflowY:"auto"}}>
          {notifs.length===0&&<div style={{padding:24,textAlign:"center",color:"#7D5C28",fontSize:13}}>No notifications yet</div>}
          {notifs.map(n=>(
            <div key={n.id} onClick={()=>markRead(n.id)} style={{padding:"12px 16px",borderBottom:"1px solid rgba(42,28,6,.5)",display:"flex",gap:10,cursor:"pointer",background:n.read?"transparent":"rgba(255,154,26,.03)"}}>
              <div style={{width:32,height:32,borderRadius:8,background:"rgba(46,24,0,.6)",border:"1px solid rgba(138,73,0,.3)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#FF9A1A"}}>
                <Icon name={imap[n.type]||"bell"} size={14}/>
              </div>
              <div style={{flex:1}}>
                <p style={{fontSize:12,color:n.read?"#9A7540":"#E8DCC8",lineHeight:1.4}}>{n.text}</p>
                <p style={{fontSize:10,color:"#614518",marginTop:3}}>{n.time||""}</p>
              </div>
              {!n.read&&<div style={{width:7,height:7,borderRadius:4,background:"#FF9A1A",flexShrink:0,marginTop:4}}/>}
            </div>
          ))}
        </div>
      </div>
    </div>
  )
}

// ─── EXHIBITIONS ──────────────────────────────────────────────
function ExhibitionsPage({ setPage, user }) {
  const [expos, setExpos] = useState([])
  const [loading, setLoading] = useState(true)
  const [filter, setFilter] = useState("All")
  const [query, setQuery] = useState("")
  const [showPublish, setShowPublish] = useState(false)
  const [showRegModal, setShowRegModal] = useState(null) // expo object
  const [regForm, setRegForm] = useState({name:"",company:"",email:"",phone:"",role:"Visitor",message:""})
  const [regSaving, setRegSaving] = useState(false)
  const [regDone, setRegDone] = useState(false)
  const [publishForm, setPublishForm] = useState({title:"",subtitle:"",date:"",location:"",category:"Multi-Sector",sectors:"",description:""})
  const [pubSaving, setPubSaving] = useState(false)
  const [pubMsg, setPubMsg] = useState("")

  useEffect(()=>{
    setLoading(true)
    getDocs("exhibitions",[]).then(data=>{
      // Only show admin-approved (non-pending) expos to public
      setExpos(data.filter(e=>e.status!=="pending_approval"))
      setLoading(false)
    }).catch(()=>setLoading(false))
  },[])

  // Pre-fill reg form from user
  useEffect(()=>{
    if(user&&!user.isGuest) setRegForm(f=>({...f,name:user.name||"",company:user.company||"",email:user.email||""}))
  },[user])

  const filtered = expos.filter(e=>{
    const mq = !query||e.title?.toLowerCase().includes(query.toLowerCase())
    const mf = filter==="All"||e.status===filter.toLowerCase()
    return mq&&mf
  })

  const publishExpo = async () => {
    if(!publishForm.title||!publishForm.date) { setPubMsg("Title and date are required."); return }
    setPubSaving(true); setPubMsg("")
    try {
      const data = {
        ...publishForm,
        sectors: publishForm.sectors.split(",").map(s=>s.trim()).filter(Boolean),
        status: "pending_approval",
        submittedBy: user?.id||"anonymous",
        submittedByName: user?.name||"Anonymous",
        exhibitors:0, visitors:0, countries:0,
        createdAt: ts()
      }
      await addDoc("exhibitions", data)
      setShowPublish(false)
      setPublishForm({title:"",subtitle:"",date:"",location:"",category:"Multi-Sector",sectors:"",description:""})
      setPubMsg("✅ Expo submitted for admin approval! You'll be notified once it's approved.")
      setTimeout(()=>setPubMsg(""),6000)
    } catch(e){ setPubMsg("Failed to submit. Try again.") }
    setPubSaving(false)
  }

  const submitRegistration = async () => {
    if(!regForm.name||!regForm.email) return
    setRegSaving(true)
    try {
      await addDoc("expo_registrations",{
        expoId: showRegModal.id,
        expoTitle: showRegModal.title,
        ...regForm,
        userId: user?.id||null,
        status: "pending",
        createdAt: ts()
      })
      // Notify admin
      await addDoc("notifications",{
        userId: "admin",
        type: "expo",
        text: `New registration for "${showRegModal.title}" by ${regForm.name}`,
        read: false,
        createdAt: ts()
      }).catch(()=>{})
      setRegDone(true)
    } catch { setRegDone(true) }
    setRegSaving(false)
  }

  const closeReg = () => { setShowRegModal(null); setRegDone(false); setRegForm(f=>({...f,role:"Visitor",message:""})) }

  return (
    <div style={{maxWidth:1280,margin:"0 auto",padding:"80px 24px 60px"}}>
      {/* Registration Modal */}
      {showRegModal&&(
        <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={closeReg}>
          <div className="card fu" style={{maxWidth:480,width:"100%",padding:28}} onClick={e=>e.stopPropagation()}>
            {regDone?(
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{fontSize:48,marginBottom:12}}>🎉</div>
                <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#FFD59A",marginBottom:8}}>Registration Submitted!</h2>
                <p style={{color:"#9A7540",fontSize:14,lineHeight:1.7,marginBottom:20}}>Your registration for <strong style={{color:"#FFB84D"}}>{showRegModal.title}</strong> is pending approval. You'll be notified once confirmed.</p>
                <button className="btn btn-p" onClick={closeReg} style={{justifyContent:"center"}}>Close</button>
              </div>
            ):(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
                  <div>
                    <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:"#FFD59A",marginBottom:4}}>Register for Expo</h2>
                    <p style={{color:"#9A7540",fontSize:13}}>{showRegModal.title}</p>
                  </div>
                  <button onClick={closeReg} style={{background:"none",border:"none",color:"#9A7540",cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Full Name *</label>
                      <input className="inp" value={regForm.name} onChange={e=>setRegForm(f=>({...f,name:e.target.value}))} placeholder="Your name"/></div>
                    <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Email *</label>
                      <input className="inp" value={regForm.email} onChange={e=>setRegForm(f=>({...f,email:e.target.value}))} placeholder="you@company.com" type="email"/></div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Company</label>
                      <input className="inp" value={regForm.company} onChange={e=>setRegForm(f=>({...f,company:e.target.value}))} placeholder="Your company"/></div>
                    <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Phone</label>
                      <input className="inp" value={regForm.phone} onChange={e=>setRegForm(f=>({...f,phone:e.target.value}))} placeholder="+251..."/></div>
                  </div>
                  <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Role / Attendance Type</label>
                    <select className="inp" value={regForm.role} onChange={e=>setRegForm(f=>({...f,role:e.target.value}))}>
                      {["Visitor","Exhibitor","Buyer","Investor","Press","Other"].map(r=><option key={r}>{r}</option>)}
                    </select></div>
                  <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Message (optional)</label>
                    <textarea className="inp" value={regForm.message} onChange={e=>setRegForm(f=>({...f,message:e.target.value}))} placeholder="What are you hoping to achieve at this expo?" style={{minHeight:60}}/></div>
                  <div style={{background:"rgba(255,154,26,.05)",border:"1px solid rgba(255,154,26,.2)",borderRadius:8,padding:"10px 14px"}}>
                    <p style={{color:"#FFB84D",fontSize:12,display:"flex",alignItems:"center",gap:6}}><Icon name="shield" size={13}/>Your registration will be confirmed once an admin approves this expo.</p>
                  </div>
                  <button className="btn btn-p" onClick={submitRegistration} disabled={regSaving||!regForm.name||!regForm.email} style={{justifyContent:"center"}}>
                    {regSaving?<Spin size={14}/>:"Submit Registration"} <Icon name="arrow" size={14}/>
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:32,flexWrap:"wrap",gap:14}}>
        <div>
          <Tag>Virtual Exhibitions</Tag>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:42,fontWeight:800,color:"#FFD59A",margin:"12px 0 10px"}}>Africa's Trade Exhibitions</h1>
          <p style={{color:"#9A7540",fontSize:15,maxWidth:480}}>Live and upcoming virtual trade exhibitions. Register for upcoming expos or publish your own.</p>
        </div>
        {!user?.isGuest&&(
          <button className="btn btn-p" onClick={()=>setShowPublish(v=>!v)} style={{fontSize:14}}>
            <Icon name="plus" size={15}/>{showPublish?"Cancel":"Publish an Expo"}
          </button>
        )}
      </div>

      {pubMsg&&<div style={{marginBottom:16,background:pubMsg.startsWith("✅")?"rgba(6,78,59,.3)":"rgba(127,29,29,.3)",border:`1px solid ${pubMsg.startsWith("✅")?"rgba(52,211,153,.2)":"rgba(252,165,165,.2)"}`,borderRadius:8,padding:"12px 16px",color:pubMsg.startsWith("✅")?"#6ee7b7":"#fca5a5",fontSize:13}}>{pubMsg}</div>}

      {/* Publish Expo Form */}
      {showPublish&&(
        <div className="card fu" style={{padding:28,marginBottom:28,borderColor:"rgba(255,154,26,.3)"}}>
          <h2 style={{fontWeight:600,color:"#E8DCC8",fontSize:17,marginBottom:6}}>Publish an Upcoming Expo</h2>
          <p style={{color:"#9A7540",fontSize:13,marginBottom:20}}>Submit your expo for review. Once an admin approves it, it will appear here and attendees can register.</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <div style={{gridColumn:"1/-1"}}><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Expo Title *</label>
              <input className="inp" value={publishForm.title} onChange={e=>setPublishForm(f=>({...f,title:e.target.value}))} placeholder="e.g. East Africa Agri-Food Summit 2026"/></div>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Subtitle</label>
              <input className="inp" value={publishForm.subtitle} onChange={e=>setPublishForm(f=>({...f,subtitle:e.target.value}))} placeholder="Brief tagline"/></div>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Date(s) *</label>
              <input className="inp" value={publishForm.date} onChange={e=>setPublishForm(f=>({...f,date:e.target.value}))} placeholder="e.g. October 5–7, 2026"/></div>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Location / Format</label>
              <input className="inp" value={publishForm.location} onChange={e=>setPublishForm(f=>({...f,location:e.target.value}))} placeholder="e.g. Virtual + Nairobi Hybrid"/></div>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Category</label>
              <select className="inp" value={publishForm.category} onChange={e=>setPublishForm(f=>({...f,category:e.target.value}))}>
                {["Multi-Sector","Agriculture","Technology","Manufacturing","Textiles","Logistics","Energy","Finance"].map(c=><option key={c}>{c}</option>)}
              </select></div>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Sectors (comma-separated)</label>
              <input className="inp" value={publishForm.sectors} onChange={e=>setPublishForm(f=>({...f,sectors:e.target.value}))} placeholder="e.g. Coffee, Pulses, Dairy"/></div>
            <div style={{gridColumn:"1/-1"}}><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Description</label>
              <textarea className="inp" value={publishForm.description} onChange={e=>setPublishForm(f=>({...f,description:e.target.value}))} placeholder="Describe the purpose, target audience, and expected outcomes of your expo…" style={{minHeight:80}}/></div>
          </div>
          {pubMsg&&<div style={{marginTop:10,color:"#fca5a5",fontSize:12}}>{pubMsg}</div>}
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button className="btn btn-p" onClick={publishExpo} disabled={pubSaving}>{pubSaving?<Spin size={14}/>:<><Icon name="send" size={14}/>Submit for Approval</>}</button>
            <button className="btn btn-g" onClick={()=>setShowPublish(false)}>Cancel</button>
          </div>
        </div>
      )}

      {/* Search & Filters */}
      <div className="card" style={{padding:16,marginBottom:20,display:"flex",flexWrap:"wrap",gap:12}}>
        <div style={{position:"relative",flex:1,minWidth:200}}>
          <Icon name="search" size={14} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#614518"}}/>
          <input className="inp" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search exhibitions..." style={{paddingLeft:36}}/>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:24,flexWrap:"wrap"}}>
        {["All","Live","Upcoming","Completed"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:"6px 16px",borderRadius:20,border:`1.5px solid ${filter===f?"#FF9A1A":"rgba(69,48,13,.5)"}`,background:filter===f?"#FF9A1A":"transparent",color:filter===f?"#0a0806":"#9A7540",fontSize:13,fontWeight:600,cursor:"pointer"}}>
            {f}
          </button>
        ))}
      </div>

      {loading?<div style={{textAlign:"center",padding:60}}><Spin size={28}/></div>:
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(400px,1fr))",gap:20}}>
          {filtered.map(expo=>(
            <div key={expo.id} className="card cardh" style={{overflow:"hidden"}}>
              <div style={{height:130,background:"linear-gradient(135deg,rgba(92,49,0,.6),rgba(10,8,6,.9))",position:"relative",padding:16,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><Badge status={expo.status}/><span className="tag">{expo.category}</span></div>
                <div>
                  <h2 style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:20,color:"#f5f0e8"}}>{expo.title}</h2>
                  <p style={{color:"#9A7540",fontSize:12,marginTop:2}}>{expo.subtitle}</p>
                </div>
              </div>
              <div style={{padding:20}}>
                <div style={{display:"flex",gap:16,color:"#7D5C28",fontSize:12,marginBottom:12}}>
                  <span style={{display:"flex",alignItems:"center",gap:4}}><Icon name="calendar" size={12}/>{expo.date}</span>
                  <span style={{display:"flex",alignItems:"center",gap:4}}><Icon name="map" size={12}/>{expo.location}</span>
                </div>
                <p style={{color:"#9A7540",fontSize:13,lineHeight:1.6,marginBottom:14}}>{expo.description}</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:16}}>
                  {(expo.sectors||[]).map(s=><Tag key={s}>{s}</Tag>)}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,paddingTop:14,borderTop:"1px solid rgba(69,48,13,.3)",marginBottom:14}}>
                  {[[expo.exhibitors||"TBA","Exhibitors"],[expo.visitors?expo.visitors.toLocaleString():"TBA","Expected Visitors"],[expo.countries||"TBA","Countries"]].map(([v,l])=>(
                    <div key={l} style={{textAlign:"center"}}>
                      <p style={{color:"#FF9A1A",fontWeight:700,fontSize:18}}>{v}</p>
                      <p style={{color:"#614518",fontSize:11}}>{l}</p>
                    </div>
                  ))}
                </div>
                {expo.status==="live"?
                  <button className="btn btn-p" style={{width:"100%",justifyContent:"center"}} onClick={()=>setShowRegModal(expo)}>● Join Now — Register</button>
                :expo.status==="upcoming"?
                  <button className="btn btn-o" style={{width:"100%",justifyContent:"center"}} onClick={()=>setShowRegModal(expo)}>
                    <Icon name="calendar" size={14}/>Register to Attend
                  </button>
                :<button className="btn btn-g" style={{width:"100%",justifyContent:"center"}}>View Recordings</button>}
              </div>
            </div>
          ))}
          {filtered.length===0&&!loading&&(
            <div style={{gridColumn:"1/-1",textAlign:"center",padding:80}}>
              <div style={{fontSize:48,marginBottom:12}}>🔍</div>
              <h3 style={{color:"#E8DCC8",marginBottom:6}}>No exhibitions found</h3>
              <p style={{color:"#7D5C28",fontSize:13,marginBottom:20}}>Try adjusting your search or publish a new expo above.</p>
              {!user?.isGuest&&<button className="btn btn-p" onClick={()=>setShowPublish(true)} style={{justifyContent:"center"}}><Icon name="plus" size={14}/>Publish an Expo</button>}
            </div>
          )}
        </div>
      }
    </div>
  )
}

  if (!expo) return <div style={{textAlign:"center",padding:100,color:"#7D5C28"}}>Exhibition not found. <button onClick={()=>setPage("exhibitions")} style={{color:"#FF9A1A",background:"none",border:"none",cursor:"pointer"}}>Back</button></div>

      <div className="card" style={{padding:32,marginBottom:20}}>

          <h2 style={{fontWeight:600,color:"#E8DCC8",fontSize:16,marginBottom:16}}>Exhibition Stats</h2>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {[[expo.exhibitors,"Exhibitors","building"],[expo.visitors?.toLocaleString(),"Expected Visitors","users"],[expo.countries,"Countries","globe"]].map(([v,l,ic])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(42,28,6,.4)",borderRadius:8,padding:"12px 16px"}}>

                  <Icon name={ic} size={15} style={{color:"#FF9A1A"}}/><span style={{color:"#9A7540",fontSize:13}}>{l}</span>

// ─── MARKETPLACE ──────────────────────────────────────────────
function MarketplacePage({ user, setPage }) {
  const [listings, setListings] = useState([])
  const [loading, setLoading] = useState(true)
  const [showAdd, setShowAdd] = useState(false)
  const [searchQ, setSearchQ] = useState("")
  const [filterCat, setFilterCat] = useState("All")
  const [form, setForm] = useState({ title:"", description:"", price:"", moq:"", category:"Agriculture & Food", origin:"", contact:"" })
  const [saving, setSaving] = useState(false)
  const [msg, setMsg] = useState("")
  const [mediaFiles, setMediaFiles] = useState([])
  const [mediaPreviews, setMediaPreviews] = useState([])
  const [lightbox, setLightbox] = useState(null) // {url, type}
  const fileInputRef = useRef(null)
  const addMoreRef = useRef(null)

  const CATS = ["All","Agriculture & Food","Textiles & Apparel","Manufacturing","Technology","Logistics","Energy","Leather & Crafts"]

  useEffect(()=>{
    setLoading(true)
    getDocs("marketplace",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(data=>{setListings(data);setLoading(false)}).catch(()=>setLoading(false))
  },[])

  // Build previews when files change
  useEffect(()=>{
    const urls = mediaFiles.map(f=>({url:URL.createObjectURL(f),type:f.type,name:f.name}))
    setMediaPreviews(urls)
    return ()=>urls.forEach(u=>URL.revokeObjectURL(u.url))
  },[mediaFiles])

  const addFiles = (newFiles) => {
    setMediaFiles(prev=>{
      const combined = [...prev,...Array.from(newFiles)]
      return combined.slice(0,20) // allow up to 20 files
    })
  }

  const removeFile = (i) => setMediaFiles(f=>f.filter((_,idx)=>idx!==i))

  // Filter out own listings; show others
  const filtered = listings.filter(l=>{
    const notMine = l.sellerId !== user?.id
    const mq = !searchQ||(l.title||"").toLowerCase().includes(searchQ.toLowerCase())||(l.description||"").toLowerCase().includes(searchQ.toLowerCase())
    const mc = filterCat==="All"||(l.category||"")=== filterCat
    return notMine&&mq&&mc
  })

  const publish = async () => {
    if (!form.title||!form.price) { setMsg("Title and price are required."); return }
    setSaving(true); setMsg("")
    try {
      const mediaNames = mediaFiles.map(f=>f.name)
      // Store preview data URLs for in-browser display (real upload would go to storage)
      const mediaDataUrls = await Promise.all(mediaFiles.slice(0,10).map(f=>new Promise(res=>{
        const r=new FileReader(); r.onload=()=>res({url:r.result,type:f.type,name:f.name}); r.readAsDataURL(f)
      })))
      const entry = { ...form, seller:user.name, sellerId:user.id, sellerCompany:user.company||"", origin:form.origin||user.country||"", mediaCount:mediaFiles.length, mediaNames, mediaDataUrls, createdAt:ts() }
      const ref = await addDoc("marketplace", entry)
      setListings(l=>[{...entry,id:ref.id},...l])
      setShowAdd(false)
      setForm({ title:"",description:"",price:"",moq:"",category:"Agriculture & Food",origin:"",contact:"" }); setMediaFiles([])
    } catch(e) { setMsg("Failed to publish. Try again.") }
    setSaving(false)
  }

  return (
    <div style={{maxWidth:1280,margin:"0 auto",padding:"80px 24px 60px"}}>
      {/* Lightbox */}
      {lightbox&&(
        <div style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,.92)",display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setLightbox(null)}>
          <button style={{position:"absolute",top:20,right:24,background:"none",border:"none",color:"#fff",fontSize:32,cursor:"pointer",lineHeight:1}}>✕</button>
          {lightbox.type.startsWith("video")?
            <video src={lightbox.url} controls autoPlay style={{maxWidth:"90vw",maxHeight:"85vh",borderRadius:10}} onClick={e=>e.stopPropagation()}/>:
            <img src={lightbox.url} alt="" style={{maxWidth:"90vw",maxHeight:"85vh",borderRadius:10,objectFit:"contain"}} onClick={e=>e.stopPropagation()}/>
          }
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:32,flexWrap:"wrap",gap:14}}>
        <div>
          <Tag>Pan-African Marketplace</Tag>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:40,fontWeight:800,color:"#FFD59A",margin:"10px 0 8px"}}>Trade Marketplace</h1>
          <p style={{color:"#9A7540",fontSize:15}}>Browse supplier listings from African businesses</p>
        </div>
        {!user?.isGuest&&<button className="btn btn-p" onClick={()=>setShowAdd(!showAdd)}><Icon name="plus" size={15}/>{showAdd?"Cancel":"+ List a Product"}</button>}
      </div>

      {/* Add listing form */}
      {showAdd&&(
        <div className="card" style={{padding:28,marginBottom:28}}>
          <h2 style={{fontWeight:600,color:"#E8DCC8",fontSize:17,marginBottom:20}}>New Marketplace Listing</h2>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div style={{gridColumn:"1/-1"}}>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Product / Service Title *</label>
              <input className="inp" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="e.g. Organic Yirgacheffe Coffee Grade 1"/>
            </div>
            <div style={{gridColumn:"1/-1"}}>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Description</label>
              <textarea className="inp" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Describe your product, specifications, certifications..."/>
            </div>
            <div>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Price / Unit *</label>
              <input className="inp" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="e.g. $3.20/kg FOB"/>
            </div>
            <div>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>MOQ</label>
              <input className="inp" value={form.moq} onChange={e=>setForm(f=>({...f,moq:e.target.value}))} placeholder="e.g. 5 MT"/>
            </div>
            <div>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Category</label>
              <select className="inp" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                {CATS.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Contact / WhatsApp <span style={{color:"#614518",fontWeight:400}}>(optional)</span></label>
              <input className="inp" value={form.contact} onChange={e=>setForm(f=>({...f,contact:e.target.value}))} placeholder="e.g. +251 912 345 678"/>
            </div>
            <div>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Origin Country</label>
              <input className="inp" value={form.origin} onChange={e=>setForm(f=>({...f,origin:e.target.value}))} placeholder="e.g. Ethiopia"/>
            </div>

            {/* Enhanced media upload */}
            <div style={{gridColumn:"1/-1"}}>
              <label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Product Photos & Videos <span style={{color:"#614518",fontWeight:400}}>(up to 20 files)</span></label>
              <input ref={fileInputRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>{ setMediaFiles(Array.from(e.target.files).slice(0,20)); e.target.value="" }}/>
              <input ref={addMoreRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>{ addFiles(e.target.files); e.target.value="" }}/>

              {mediaPreviews.length===0?(
                <div onClick={()=>fileInputRef.current?.click()} style={{border:"2px dashed rgba(138,73,0,.4)",borderRadius:10,padding:"28px 16px",textAlign:"center",cursor:"pointer",background:"rgba(19,13,2,.4)",transition:"border-color .2s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(255,154,26,.6)"} onMouseLeave={e=>e.currentTarget.style.borderColor="rgba(138,73,0,.4)"}>
                  <div style={{fontSize:32,marginBottom:8}}>📷</div>
                  <p style={{color:"#9A7540",fontSize:13,fontWeight:600,marginBottom:4}}>Click to upload product photos or videos</p>
                  <p style={{color:"#614518",fontSize:11}}>JPG, PNG, MP4, MOV — up to 20 files.</p>
                </div>
              ):(
                <div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:10,marginBottom:12}}>
                    {mediaPreviews.map((f,i)=>(
                      <div key={i} style={{position:"relative",borderRadius:8,overflow:"hidden",border:"1px solid rgba(138,73,0,.4)",background:"rgba(19,13,2,.6)",cursor:"pointer",aspectRatio:"1"}} onClick={()=>setLightbox(f)}>
                        {f.type.startsWith("video")?
                          <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:4}}>

                          </div>:
                          <img src={f.url} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>

                        <button onClick={e=>{e.stopPropagation();removeFile(i)}} style={{position:"absolute",top:4,right:4,width:20,height:20,borderRadius:10,background:"rgba(127,29,29,.9)",border:"none",color:"#fca5a5",cursor:"pointer",fontSize:12,lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>

                      <Icon name="plus" size={20} style={{color:"#FF9A1A"}}/>
                      <span style={{color:"#7D5C28",fontSize:10}}>Add more</span>
                    </div>
                  </div>
                  <p style={{color:"#9A7540",fontSize:12}}>{mediaPreviews.length} file{mediaPreviews.length!==1?"s":""} selected — click any to preview, ✕ to remove</p>
                </div>

            </div>

              {saving?<Spin size={14}/>:"Publish Listing"}

            <button className="btn btn-g" onClick={()=>setShowAdd(false)}>Cancel</button>
          </div>
        </div>
      )}

      {/* Filters */}
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{position:"relative",flex:1,minWidth:200}}>
          <Icon name="search" size={13} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#614518"}}/>
          <input className="inp" placeholder="Search products…" value={searchQ} onChange={e=>setSearchQ(e.target.value)} style={{paddingLeft:30}}/>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {CATS.map(c=>(
            <button key={c} onClick={()=>setFilterCat(c)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${filterCat===c?"#FF9A1A":"rgba(69,48,13,.4)"}`,background:filterCat===c?"rgba(255,154,26,.1)":"transparent",color:filterCat===c?"#FF9A1A":"#9A7540",fontSize:12,cursor:"pointer"}}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {loading?<div style={{textAlign:"center",padding:60}}><Spin size={28}/></div>:
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:16}}>
          {filtered.map(l=>{
            const media = l.mediaDataUrls||[]
            return (
              <div key={l.id} className="card cardh" style={{padding:0,overflow:"hidden"}}>
                {/* Media gallery */}
                {media.length>0&&(
                  <div style={{position:"relative",background:"rgba(10,8,6,.9)"}}>
                    {media[0].type.startsWith("video")?
                      <video src={media[0].url} style={{width:"100%",height:180,objectFit:"cover",display:"block",cursor:"pointer"}} onClick={()=>setLightbox(media[0])}/>:
                      <img src={media[0].url} alt={l.title} style={{width:"100%",height:180,objectFit:"cover",display:"block",cursor:"pointer"}} onClick={()=>setLightbox(media[0])}/>
                    }
                    {media.length>1&&(
                      <div style={{position:"absolute",bottom:8,right:8,display:"flex",gap:4}}>
                        {media.slice(1,4).map((m,i)=>(
                          <div key={i} style={{width:36,height:36,borderRadius:6,overflow:"hidden",border:"2px solid rgba(255,154,26,.6)",cursor:"pointer"}} onClick={()=>setLightbox(m)}>
                            {m.type.startsWith("video")?
                              <div style={{width:"100%",height:"100%",background:"rgba(10,8,6,.8)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="video" size={14} style={{color:"#FF9A1A"}}/></div>:
                              <img src={m.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                            }
                          </div>
                        ))}
                        {media.length>4&&<div style={{width:36,height:36,borderRadius:6,background:"rgba(10,8,6,.8)",border:"2px solid rgba(69,48,13,.4)",display:"flex",alignItems:"center",justifyContent:"center",color:"#9A7540",fontSize:10}}>+{media.length-4}</div>}
                      </div>
                    )}
                  </div>
                )}
                <div style={{padding:20}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <Tag>{l.category}</Tag>
                    {l.mediaCount>0&&media.length===0&&<span style={{fontSize:10,color:"#9A7540",display:"flex",alignItems:"center",gap:3}}>📷 {l.mediaCount}</span>}
                  </div>
                  <h3 style={{fontWeight:600,color:"#E8DCC8",fontSize:15,marginBottom:6}}>{l.title}</h3>
                  <p style={{color:"#9A7540",fontSize:12,lineHeight:1.6,marginBottom:14}}>{(l.description||"").slice(0,100)}{(l.description||"").length>100?"…":""}</p>
                  <div style={{display:"flex",gap:14,marginBottom:14}}>
                    <div><p style={{color:"#7D5C28",fontSize:10}}>PRICE</p><p style={{color:"#FF9A1A",fontWeight:700,fontSize:16}}>{l.price}</p></div>
                    {l.moq&&<div><p style={{color:"#7D5C28",fontSize:10}}>MOQ</p><p style={{color:"#E8DCC8",fontWeight:600,fontSize:14}}>{l.moq}</p></div>}
                    {l.origin&&<div><p style={{color:"#7D5C28",fontSize:10}}>ORIGIN</p><p style={{color:"#E8DCC8",fontWeight:600,fontSize:14}}>{l.origin}</p></div>}
                  </div>
                  <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#7D5C28",display:"flex",alignItems:"center",gap:4}}><Icon name="building" size={11}/>{l.seller}</span>
                  </div>
                  {l.contact&&<a href={"https://wa.me/"+(l.contact||"").replace(/[^0-9+]/g,"")} target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",gap:6,justifyContent:"center",width:"100%",padding:"8px",background:"rgba(37,211,102,.15)",border:"1px solid rgba(37,211,102,.3)",borderRadius:8,color:"#4ade80",fontSize:12,fontWeight:600,textDecoration:"none",marginBottom:8}}>💬 WhatsApp Seller</a>}
                  <button className="btn btn-p" style={{width:"100%",justifyContent:"center",fontSize:12,padding:"8px"}} onClick={()=>setPage("messages")}>Send Platform Message</button>
                </div>
              </div>
            )
          })}
          {filtered.length===0&&(
            <div style={{gridColumn:"1/-1",textAlign:"center",padding:60}}>
              <div style={{fontSize:48,marginBottom:12}}>🛒</div>
              <p style={{color:"#7D5C28",fontSize:14}}>No listings from other sellers yet.</p>
              {!user?.isGuest&&<button className="btn btn-p" onClick={()=>setShowAdd(true)} style={{marginTop:12,fontSize:13}}>+ List your first product</button>}
            </div>
          )}
        </div>
      }
    </div>
  )
}

// ─── FINANCING REGISTRATION ───────────────────────────────────
function FinancingPage({ user }) {
  const [form, setForm] = useState({
    orgName:"", orgType:"Commercial Bank", regNumber:"", taxId:"", country:"Ethiopia",
    contactName:"", contactTitle:"", contactEmail:"", contactPhone:"",
    website:"", linkedIn:"", yearEstablished:"", capitalBase:"",
    servicesOffered:[], tradeFinanceProducts:"", minLoanAmount:"", maxLoanAmount:"",
    targetSectors:[], coverageCountries:"", swiftCode:"", correspondentBanks:"",
    regulatoryBody:"", licenseNumber:"", licenseExpiry:"",
    auditorName:"", lastAuditYear:"", isoCompliant:false, basleCompliant:false,
    description:"", motivation:"",
    licenseDoc:"", registrationDoc:"", financialStatementsDoc:"", regulatoryApprovalDoc:""
  })
  const [saving, setSaving] = useState(false)
  const [done, setDone] = useState(false)
  const [err, setErr] = useState("")
  const [step, setStep] = useState(1)
  const set = (k,v)=>setForm(f=>({...f,[k]:v}))
  const toggleArr = (k,v)=>setForm(f=>({...f,[k]:f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]}))

  const SERVICES = ["Export Invoice Financing","Import Financing","Letter of Credit (LC)","Trade Credit Facility","SME Loans","Supply Chain Finance","Forfaiting","Factoring","Bonds & Guarantees","Working Capital Loans"]
  const SECTORS = ["Agriculture & Food","Textiles & Apparel","Manufacturing","Technology","Energy","Mining","Pharmaceuticals","Construction","Retail","Logistics"]
  const ORG_TYPES = ["Commercial Bank","Development Bank","Microfinance Institution","Investment Fund","Insurance Company","FinTech / Digital Lender","Credit Union","International Financial Institution","Private Equity Fund","Other"]

  const submit = async () => {
    if (!form.orgName||!form.contactEmail||!form.regNumber) { setErr("Organisation Name, Registration Number, and Contact Email are required."); return }
    if (form.servicesOffered.length===0) { setErr("Please select at least one service offered."); return }
    setSaving(true); setErr("")
    try {
      await addDoc("financier_registrations", {
        ...form, status:"pending_approval", submittedBy:user?.id||"anonymous",
        submittedByName:user?.name||"Anonymous", createdAt:ts()
      })
      await addDoc("notifications",{userId:"admin",type:"dollar",text:`New financier registration: ${form.orgName}`,read:false,createdAt:ts()}).catch(()=>{})
      setDone(true)
    } catch(e){ setErr("Submission failed. Please try again.") }
    setSaving(false)
  }

  const FieldLabel = ({children,req})=><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>{children}{req&&<span style={{color:"#FF9A1A"}}> *</span>}</label>
  const Inp = (props)=><input className="inp" {...props}/>
  const Sel = ({children,...props})=><select className="inp" {...props}>{children}</select>
  const Txt = (props)=><textarea className="inp" style={{minHeight:80,...(props.style||{})}} {...props}/>

  if (done) return (
    <div style={{maxWidth:600,margin:"80px auto",padding:24,textAlign:"center"}}>
      <div className="card fu" style={{padding:52}}>
        <div style={{fontSize:56,marginBottom:16}}>🏦</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:26,color:"#FFD59A",marginBottom:10}}>Application Submitted!</h2>
        <p style={{color:"#9A7540",fontSize:15,lineHeight:1.8,marginBottom:8}}>Thank you for applying to join AfriExpo as a <strong style={{color:"#FFB84D"}}>Trade Finance Provider</strong>.</p>
        <p style={{color:"#7D5C28",fontSize:13,lineHeight:1.7,marginBottom:24}}>Our admin team will review your documentation and credentials. You will receive an email notification within <strong style={{color:"#E8DCC8"}}>3–5 business days</strong> once your application is approved or if additional information is needed.</p>
        <div style={{background:"rgba(255,154,26,.07)",border:"1px solid rgba(255,154,26,.2)",borderRadius:10,padding:"14px 18px",marginBottom:24,textAlign:"left"}}>
          <p style={{color:"#FFB84D",fontSize:12,fontWeight:600,marginBottom:6}}>📋 What happens next?</p>
          <p style={{color:"#9A7540",fontSize:12,lineHeight:1.7}}>1. Admin reviews your documentation<br/>2. Verification of regulatory licences<br/>3. Profile approved &amp; published on AfriExpo<br/>4. You gain access to connect with exhibitors &amp; buyers</p>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <button className="btn btn-p" onClick={()=>setDone(false)} style={{fontSize:13}}>Submit Another Application</button>
        </div>
      </div>
    </div>
  )

  return (
    <div style={{maxWidth:900,margin:"0 auto",padding:"80px 24px 60px"}}>
      <div style={{marginBottom:36}}>
        <Tag>Trade Finance Provider</Tag>

        <p style={{color:"#9A7540",fontSize:15,maxWidth:580}}>Banks, financial institutions, and trade finance providers — register on AfriExpo to connect with African businesses seeking capital for trade and export.</p>
      </div>

      <div className="card" style={{display:"flex",flexWrap:"wrap",gap:20,justifyContent:"center",padding:"14px 24px",marginBottom:32}}>
        {[["shield","Regulated Institutions Only"],["check","Admin Verified"],["dollar","Connect with Exporters"],["globe","Pan-African Reach"]].map(([ic,t])=>(
          <div key={t} style={{display:"flex",alignItems:"center",gap:8,color:"#9A7540",fontSize:13}}><Icon name={ic} size={15} style={{color:"#FF9A1A"}}/>{t}</div>
        ))}
      </div>

      {/* Step tabs */}
      <div style={{display:"flex",gap:4,marginBottom:28,overflowX:"auto"}} className="sh">
        {[["1","Organisation Info"],["2","Services & Products"],["3","Regulatory & Compliance"],["4","Documents & Submit"]].map(([n,label],i)=>(
          <button key={n} onClick={()=>setStep(i+1)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",borderRadius:8,border:`1.5px solid ${step===i+1?"#FF9A1A":step>i+1?"rgba(52,211,153,.4)":"rgba(69,48,13,.4)"}`,background:step===i+1?"rgba(255,154,26,.1)":"transparent",color:step===i+1?"#FF9A1A":step>i+1?"#34d399":"#7D5C28",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
            <div style={{width:22,height:22,borderRadius:11,background:step===i+1?"#FF9A1A":step>i+1?"#34d399":"rgba(42,28,6,.7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:step>=i+1?"#0a0806":"#614518",flexShrink:0}}>
              {step>i+1?<Icon name="check" size={11}/>:n}

          </button>
        ))}
      </div>

      {step===1&&(
        <div className="card fu" style={{padding:32}}>
          <h2 style={{fontWeight:600,color:"#E8DCC8",fontSize:18,marginBottom:22}}>Organisation Information</h2>
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div><FieldLabel req>Organisation / Institution Name</FieldLabel><Inp value={form.orgName} onChange={e=>set("orgName",e.target.value)} placeholder="e.g. Awash Bank S.C."/></div>
              <div><FieldLabel req>Organisation Type</FieldLabel>
                <Sel value={form.orgType} onChange={e=>set("orgType",e.target.value)}>

            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div><FieldLabel req>Commercial Registration Number</FieldLabel><Inp value={form.regNumber} onChange={e=>set("regNumber",e.target.value)} placeholder="e.g. REG-2001-ET-00123"/></div>
              <div><FieldLabel>Tax Identification Number (TIN)</FieldLabel><Inp value={form.taxId} onChange={e=>set("taxId",e.target.value)} placeholder="e.g. 0000123456"/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div><FieldLabel>Year Established</FieldLabel><Inp value={form.yearEstablished} onChange={e=>set("yearEstablished",e.target.value)} placeholder="e.g. 1994"/></div>
              <div><FieldLabel>Country of Incorporation</FieldLabel>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div><FieldLabel>Website</FieldLabel><Inp value={form.website} onChange={e=>set("website",e.target.value)} placeholder="https://..."/></div>
              <div><FieldLabel>LinkedIn Page</FieldLabel><Inp value={form.linkedIn} onChange={e=>set("linkedIn",e.target.value)} placeholder="https://linkedin.com/company/..."/></div>
            </div>
            <div><FieldLabel>Capital Base / Total Assets (optional)</FieldLabel><Inp value={form.capitalBase} onChange={e=>set("capitalBase",e.target.value)} placeholder="e.g. ETB 50 Billion"/></div>
            <div><FieldLabel req>Brief Institutional Description</FieldLabel><Txt value={form.description} onChange={e=>set("description",e.target.value)} placeholder="Describe your institution, its history, and its role in trade finance in Africa…"/></div>
            <button className="btn btn-p" onClick={()=>setStep(2)} style={{justifyContent:"center",marginTop:8}}>Continue to Services →</button>
          </div>
        </div>
      )}

      {step===2&&(
        <div className="card fu" style={{padding:32}}>
          <h2 style={{fontWeight:600,color:"#E8DCC8",fontSize:18,marginBottom:22}}>Services & Financial Products</h2>
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <div><FieldLabel req>Trade Finance Services Offered (select all that apply)</FieldLabel>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
                {SERVICES.map(s=>(
                  <button key={s} onClick={()=>toggleArr("servicesOffered",s)} style={{padding:"7px 14px",borderRadius:20,border:`1.5px solid ${form.servicesOffered.includes(s)?"#FF9A1A":"rgba(69,48,13,.4)"}`,background:form.servicesOffered.includes(s)?"rgba(255,154,26,.12)":"transparent",color:form.servicesOffered.includes(s)?"#FF9A1A":"#9A7540",fontSize:12,cursor:"pointer",fontWeight:500}}>

              <div><FieldLabel req>Operating Licence Number</FieldLabel><Inp value={form.licenseNumber} onChange={e=>set("licenseNumber",e.target.value)} placeholder="e.g. NBE/2021/01234"/></div>

}

// ─── AI MATCHMAKING ───────────────────────────────────────────
function MatchmakingPage({ user }) {
  const [step, setStep] = useState(1)
  const [prefs, setPrefs] = useState({ company:user?.company||"", industry:"Agriculture", country:user?.country||"Ethiopia", seeking:"Buyers", region:"Europe", size:"SME (25-250)", volume:"$100K+" })
  const [loading, setLoading] = useState(false)
  const [matches, setMatches] = useState([])
  const [aiInsight, setAiInsight] = useState("")
  const [aiLoading, setAiLoading] = useState(false)
  const set = (k,v)=>setPrefs(p=>({...p,[k]:v}))
  const INDUSTRIES = ["Agriculture","Textiles","Technology","Manufacturing","Logistics","Energy","Finance"]
  const SEEKING = ["Buyers","Suppliers","Investors","Distributors","Partners"]

  const runMatch = async () => {
    setLoading(true)
    // Fetch real registered exhibitors as candidates
    const exhibitors = await getDocs("users",[{type:"where",f:"role",op:"==",v:"exhibitor"}]).catch(()=>[])
    await new Promise(r=>setTimeout(r,1000))
    const candidates = exhibitors.length>0
      ? exhibitors.slice(0,6).map((e,i)=>({...e, matchScore:95-i*3, matchReason:"Based on your industry vertical and target markets — strong alignment detected."})).sort((a,b)=>b.matchScore-a.matchScore)
      : []
    setMatches(candidates)
    setLoading(false); setStep(3)
    if (candidates.length>0) getAiInsight(candidates[0])
  }

// ─── MESSAGES ─────────────────────────────────────────────────
function MessagesPage({ user }) {
  const [conversations, setConversations] = useState([])
  const [activeId, setActiveId] = useState(null)
  const [messages, setMessages] = useState([])
  const [newMsg, setNewMsg] = useState("")
  const [sending, setSending] = useState(false)
  const [newConv, setNewConv] = useState(false)
  const [newConvWith, setNewConvWith] = useState("")
  const bottomRef = useRef(null)

  // Load conversations
  useEffect(()=>{
    if (!user?.id||user.isGuest) return
    const unsub = onSnap("conversations",[{type:"where",f:"participants",op:"array-contains",v:user.id},{type:"orderBy",f:"updatedAt",dir:"desc"}], docs=>setConversations(docs))
    return ()=>unsub?.()
  },[user?.id])

  // Load messages for active conv
  useEffect(()=>{
    if (!activeId) return
    const unsub = onSnap("messages",[{type:"where",f:"conversationId",op:"==",v:activeId},{type:"orderBy",f:"createdAt",dir:"asc"}], docs=>setMessages(docs))
    return ()=>unsub?.()
  },[activeId])

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}) },[messages])

  const active = conversations.find(c=>c.id===activeId)

  const send = async () => {
    if (!newMsg.trim()||!activeId) return
    setSending(true)
    const m = { conversationId:activeId, senderId:user.id, senderName:user.name, text:newMsg.trim(), createdAt:ts() }
    setNewMsg("")
    try {
      await addDoc("messages",m)
      await updateDoc("conversations",activeId,{lastMessage:m.text,updatedAt:ts()})
    } catch {}
    setSending(false)
  }

  const startConv = async () => {
    if (!newConvWith.trim()) return
    const c = { participants:[user.id], participantNames:[user.name], withName:newConvWith.trim(), lastMessage:"", createdAt:ts(), updatedAt:ts(), creatorId:user.id }
    try {
      const ref = await addDoc("conversations",c)
      setActiveId(ref.id)
    } catch {}
    setNewConv(false); setNewConvWith("")
  }

  if (user?.isGuest) return (
    <div style={{maxWidth:600,margin:"80px auto",padding:24,textAlign:"center"}}>
      <div className="card" style={{padding:48}}>
        <Icon name="msg" size={48} style={{color:"#614518",margin:"0 auto 16px",display:"block"}}/>
        <h2 style={{color:"#E8DCC8",marginBottom:8}}>Sign in to access messages</h2>
        <p style={{color:"#9A7540",fontSize:14}}>Create a free account to start B2B conversations with African businesses.</p>
      </div>
    </div>
  )

  return (
    <div style={{maxWidth:1200,margin:"0 auto",padding:"80px 24px 60px"}}>
      <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:"#FFD59A",marginBottom:20}}>Messages</h1>
      <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:16,height:"calc(100vh - 220px)"}}>
        {/* Sidebar */}
        <div className="card" style={{display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:12,borderBottom:"1px solid rgba(69,48,13,.3)"}}>
            <button className="btn btn-p" onClick={()=>setNewConv(!newConv)} style={{width:"100%",justifyContent:"center",fontSize:12}}>
              <Icon name="plus" size={14}/> New Conversation
            </button>
          </div>
          {newConv&&(
            <div style={{padding:12,borderBottom:"1px solid rgba(69,48,13,.3)",background:"rgba(42,28,6,.3)"}}>
              <input className="inp" value={newConvWith} onChange={e=>setNewConvWith(e.target.value)} placeholder="Company or person name..." style={{marginBottom:8,fontSize:12}}/>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-p" onClick={startConv} style={{flex:1,justifyContent:"center",fontSize:12,padding:"7px"}}>Start</button>
                <button className="btn btn-g" onClick={()=>setNewConv(false)} style={{fontSize:12,padding:"7px 10px"}}>✕</button>
              </div>
            </div>
          )}
          <div style={{flex:1,overflowY:"auto"}}>
            {conversations.length===0&&<div style={{padding:20,textAlign:"center",color:"#7D5C28",fontSize:13}}>No conversations yet. Start one above!</div>}
            {conversations.map(c=>(
              <div key={c.id} onClick={()=>setActiveId(c.id)} style={{padding:"12px 14px",borderBottom:"1px solid rgba(42,28,6,.5)",cursor:"pointer",background:activeId===c.id?"rgba(138,73,0,.15)":"transparent",display:"flex",alignItems:"center",gap:10}}>
                <Av name={c.withName||"?"} color="#7c3d12" size={36}/>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontWeight:600,color:"#E8DCC8",fontSize:13}}>{c.withName}</p>
                  <p style={{color:"#7D5C28",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.lastMessage||"Start a conversation"}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Chat area */}
        {active?(
          <div className="card" style={{display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"12px 18px",borderBottom:"1px solid rgba(69,48,13,.3)",display:"flex",alignItems:"center",gap:12}}>
              <Av name={active.withName||"?"} color="#7c3d12" size={36}/>
              <div style={{flex:1}}>
                <p style={{fontWeight:600,color:"#E8DCC8",fontSize:14}}>{active.withName}</p>
                <p style={{color:"#7D5C28",fontSize:11}}>B2B Conversation</p>
              </div>
              <button className="btn btn-g" style={{padding:"6px 12px",fontSize:12}}><Icon name="calendar" size={13}/> Schedule Meeting</button>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:"16px 20px",display:"flex",flexDirection:"column",gap:10}}>
              {messages.length===0&&<div style={{textAlign:"center",color:"#614518",fontSize:13,padding:20}}>Say hello to start the conversation!</div>}
              {messages.map(m=>(
                <div key={m.id} style={{display:"flex",justifyContent:m.senderId===user.id?"flex-end":"flex-start"}}>
                  <div className={m.senderId===user.id?"msgme":"msgthem"} style={{maxWidth:"70%",padding:"10px 14px",fontSize:13,color:"#E8DCC8",lineHeight:1.6}}>
                    {m.senderId!==user.id&&<p style={{fontSize:10,color:"#FF9A1A",marginBottom:4,fontWeight:600}}>{m.senderName}</p>}
                    <p>{m.text}</p>
                  </div>
                </div>
              ))}
              <div ref={bottomRef}/>
            </div>
            <div style={{padding:"12px 16px",borderTop:"1px solid rgba(69,48,13,.3)",display:"flex",gap:10}}>
              <input className="inp" value={newMsg} onChange={e=>setNewMsg(e.target.value)} placeholder="Type a message…" style={{flex:1}} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}/>
              <button className="btn btn-p" onClick={send} disabled={sending||!newMsg.trim()} style={{flexShrink:0}}>
                {sending?<Spin size={14}/>:<Icon name="send" size={15}/>}
              </button>
            </div>
          </div>
        ):(
          <div className="card" style={{display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
            <Icon name="msg" size={40} style={{color:"#614518"}}/>
            <p style={{color:"#7D5C28",fontSize:14}}>Select a conversation or start a new one</p>
          </div>
        )}
      </div>
    </div>
  )
}

  const [bookingForm, setBookingForm] = useState({with:"",date:"",time:"",topic:""})
  const [bookingMsg, setBookingMsg] = useState("")
  const [stats, setStats] = useState({views:0,inquiries:0,meetingsCount:0})

  useEffect(()=>{
    if (!user?.id||user.isGuest) return
    getDocs("meetings",[{type:"where",f:"userId",op:"==",v:user.id},{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setMeetings).catch(()=>{})
    getDocs("marketplace",[{type:"where",f:"sellerId",op:"==",v:user.id}]).then(setListings).catch(()=>{})
  },[user?.id,tab])

    if (!bookingForm.with||!bookingForm.date) return
    const entry = {...bookingForm,userId:user.id,userName:user.name,status:"confirmed",createdAt:ts()}

    setTimeout(()=>setBookingMsg(""),3000)

// ─── PROFILE SETTINGS (inside dashboard) ─────────────────────
function ProfileSettings({ user, onSaved }) {
  const [form, setForm] = useState({
    name:user.name||"", company:user.company||"", role:user.role||"visitor",
    country:user.country||"", bio:user.bio||"", phone:user.phone||"",
    website:user.website||"", category:user.category||"", description:user.description||"",
    seeking:user.seeking||"",
    tags:(user.tags||[]).join(", "),
  })
  // Products as structured objects
  const [products, setProducts] = useState(
    (user.products||[]).map(p=>typeof p==="string"?{name:p,description:"",price:""}:p)
  )
  const [saving, setSaving] = useState(false)
  const [success, setSuccess] = useState(false)
  const [err, setErr] = useState("")
  const [requestBadge, setRequestBadge] = useState(false)
  const [badgeSent, setBadgeSent] = useState(user.badgeRequested||false)

  const addProduct = () => setProducts(p=>[...p,{name:"",description:"",price:""}])
  const removeProduct = (i) => setProducts(p=>p.filter((_,idx)=>idx!==i))
  const updateProduct = (i,k,v) => setProducts(p=>p.map((x,idx)=>idx===i?{...x,[k]:v}:x))

  const isProfileComplete = form.name&&form.company&&form.country&&form.category&&form.description&&products.length>0

  const sendBadgeRequest = async () => {
    try {
      await addDoc("notifications",{userId:"admin",type:"award",text:`Badge requested by ${user.name} (${user.company||"—"}) — profile complete`,read:false,createdAt:ts()}).catch(()=>{})
      await updateDoc("users",user.id,{badgeRequested:true}).catch(()=>{})
      setBadgeSent(true); setRequestBadge(false)
    } catch { setBadgeSent(true); setRequestBadge(false) }
  }

  const save = async () => {
    setSaving(true); setErr(""); setSuccess(false)
    try {
      const tagsArr = form.tags.split(",").map(s=>s.trim()).filter(Boolean)
      await updateDoc("users",user.id,{ ...form, products, tags:tagsArr, updatedAt:ts() })
      if (auth()?.currentUser) await auth().currentUser.updateProfile({ displayName: form.name }).catch(()=>{})
      setSuccess(true)
      setTimeout(()=>{ setSuccess(false); onSaved&&onSaved() },1800)
    } catch(e) { setErr(e.message||"Failed to save.") }
    setSaving(false)
  }

  const ROLES = ["exhibitor","buyer","investor","logistics","visitor"]
  const COUNTRIES = ["Ethiopia","Kenya","Rwanda","Tanzania","Uganda","Ghana","Nigeria","South Africa","Egypt","Morocco","Senegal","Other"]
  const CATEGORIES = ["Agriculture & Food","Textiles & Apparel","Manufacturing","Technology & ICT","Logistics & Transport","Energy & Sustainability","Finance & Banking","Leather & Crafts","Healthcare","Other"]

  return (
    <div style={{maxWidth:700}}>
      {success&&<div style={{background:"rgba(6,78,59,.3)",border:"1px solid rgba(52,211,153,.2)",borderRadius:10,padding:"12px 16px",color:"#6ee7b7",fontSize:13,marginBottom:16,display:"flex",alignItems:"center",gap:8}}><Icon name="check" size={14}/> Profile saved! Redirecting…</div>}
      {err&&<div style={{background:"rgba(127,29,29,.3)",border:"1px solid rgba(252,165,165,.2)",borderRadius:10,padding:"12px 16px",color:"#fca5a5",fontSize:13,marginBottom:16}}>{err}</div>}

      {/* Badge request */}
      {!user.verified&&!user.badgeApproved&&(
        <div className="card" style={{padding:20,marginBottom:16,borderColor:"rgba(255,154,26,.3)",background:"rgba(255,154,26,.04)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <Icon name="award" size={22} style={{color:"#FF9A1A",flexShrink:0}}/>
            <div style={{flex:1}}>
              <p style={{fontWeight:600,color:"#FFB84D",fontSize:14,marginBottom:2}}>Earn Your Verified Badge</p>
              <p style={{color:"#9A7540",fontSize:13}}>Complete your profile with all required fields and at least one product/service, then request your badge. An admin will review and approve.</p>
            </div>
            {badgeSent?
              <span style={{color:"#6ee7b7",fontSize:12,display:"flex",alignItems:"center",gap:5,flexShrink:0}}><Icon name="check" size={13}/>Request Sent</span>:
              <button className="btn btn-p" onClick={()=>setRequestBadge(true)} disabled={!isProfileComplete} style={{flexShrink:0,fontSize:12}}>
                {isProfileComplete?"Request Badge":"Fill Profile First"}
              </button>
            }
          </div>
          {requestBadge&&(
            <div style={{marginTop:14,borderTop:"1px solid rgba(255,154,26,.2)",paddingTop:14}}>
              <p style={{color:"#9A7540",fontSize:13,marginBottom:12}}>Confirm you've completed your profile and would like admin to review for badge approval.</p>
              <div style={{display:"flex",gap:10}}>
                <button className="btn btn-p" onClick={sendBadgeRequest} style={{fontSize:12}}><Icon name="send" size={13}/>Confirm Request</button>
                <button className="btn btn-g" onClick={()=>setRequestBadge(false)} style={{fontSize:12}}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      )}
      {user.verified&&(
        <div className="card" style={{padding:16,marginBottom:16,borderColor:"rgba(52,211,153,.3)",background:"rgba(6,78,59,.1)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="award" size={20} style={{color:"#34d399"}}/>
            <p style={{color:"#6ee7b7",fontSize:13,fontWeight:600}}>✓ Verified Badge Active — Your profile is verified by AfriExpo.</p>
          </div>

      <div className="card" style={{padding:28,marginBottom:16}}>
        <h3 style={{fontWeight:600,color:"#E8DCC8",fontSize:16,marginBottom:20}}>Personal Info</h3>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>

          <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Company / Organisation</label>
            <input className="inp" value={form.company} onChange={e=>setForm(f=>({...f,company:e.target.value}))}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Role</label>
              <select className="inp" value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                {ROLES.map(r=><option key={r} value={r}>{r.charAt(0).toUpperCase()+r.slice(1)}</option>)}

              <select className="inp" value={form.country} onChange={e=>setForm(f=>({...f,country:e.target.value}))}>

          <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Phone</label>

          <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:6}}>Website</label>
            <input className="inp" value={form.website} onChange={e=>setForm(f=>({...f,website:e.target.value}))} placeholder="https://..."/></div>

      <div className="card" style={{padding:28,marginBottom:16}}>
        <h3 style={{fontWeight:600,color:"#E8DCC8",fontSize:16,marginBottom:20}}>Booth Info</h3>

// ─── ADMIN ────────────────────────────────────────────────────
function AdminPage({ user }) {
  const [tab, setTab] = useState("overview")
  const [users, setUsers] = useState([])
  const [expos, setExpos] = useState([])
  const [marketplace, setMarketplace] = useState([])
  const [meetings, setMeetings] = useState([])
  const [registrations, setRegistrations] = useState([])
  const [financierRegs, setFinancierRegs] = useState([])
  const [logisticsRegs, setLogisticsRegs] = useState([])
  const [expoProviderRegs, setExpoProviderRegs] = useState([])
  const [loading, setLoading] = useState(false)
  const [search, setSearch] = useState("")
  const [expoForm, setExpoForm] = useState({ title:"", subtitle:"", date:"", location:"", category:"Multi-Sector", status:"upcoming", exhibitors:0, visitors:0, countries:0, sectors:"", description:"" })
  const [addingExpo, setAddingExpo] = useState(false)
  const [saving, setSaving] = useState(false)
  const [expandedId, setExpandedId] = useState(null)

  useEffect(()=>{
    setLoading(true)
    const loads = {
      overview: ()=>Promise.all([getDocs("users",[]).catch(()=>[]),getDocs("exhibitions",[]).catch(()=>[]),getDocs("marketplace",[]).catch(()=>[]),getDocs("meetings",[]).catch(()=>[]),getDocs("financier_registrations",[]).catch(()=>[]),getDocs("logistics_registrations",[]).catch(()=>[]),getDocs("expo_provider_registrations",[]).catch(()=>[])]).then(([u,e,m,mt,fr,lr,epr])=>{setUsers(u);setExpos(e);setMarketplace(m);setMeetings(mt);setFinancierRegs(fr);setLogisticsRegs(lr);setExpoProviderRegs(epr)}),
      users: ()=>getDocs("users",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setUsers).catch(()=>{}),
      exhibitions: ()=>getDocs("exhibitions",[]).then(setExpos).catch(()=>{}),
      marketplace: ()=>getDocs("marketplace",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setMarketplace).catch(()=>{}),
      meetings: ()=>getDocs("meetings",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setMeetings).catch(()=>{}),
      registrations: ()=>getDocs("expo_registrations",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setRegistrations).catch(()=>{}),
      financiers: ()=>getDocs("financier_registrations",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setFinancierRegs).catch(()=>{}),
      logistics: ()=>getDocs("logistics_registrations",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setLogisticsRegs).catch(()=>{}),
      expo_providers: ()=>getDocs("expo_provider_registrations",[{type:"orderBy",f:"createdAt",dir:"desc"}]).then(setExpoProviderRegs).catch(()=>{}),
    }
    ;(loads[tab]||loads.overview)().finally(()=>setLoading(false))
  },[tab])

  const verify = async (uid) => {
    await updateDoc("users",uid,{verified:true,badgeApproved:true}).catch(()=>{})
    setUsers(u=>u.map(x=>x.id===uid?{...x,verified:true,badgeApproved:true}:x))
  }
  const approveExpo = async (id) => {
    await updateDoc("exhibitions",id,{status:"upcoming"}).catch(()=>{})
    setExpos(e=>e.map(x=>x.id===id?{...x,status:"upcoming"}:x))
  }
  const rejectExpo = async (id) => {
    if(!confirm("Reject and delete this expo submission?")) return
    await deleteDoc("exhibitions",id).catch(()=>{})
    setExpos(e=>e.filter(x=>x.id!==id))
  }
  const approveReg = async (id) => {
    await updateDoc("expo_registrations",id,{status:"approved"}).catch(()=>{})
    setRegistrations(r=>r.map(x=>x.id===id?{...x,status:"approved"}:x))
  }
  const deleteUser = async (uid) => {
    if (!confirm("Delete this user?")) return
    await deleteDoc("users",uid).catch(()=>{})
    setUsers(u=>u.filter(x=>x.id!==uid))
  }
  const deleteExpo = async (id) => {
    if (!confirm("Delete this exhibition?")) return
    await deleteDoc("exhibitions",id).catch(()=>{})
    setExpos(e=>e.filter(x=>x.id!==id))
  }
  const addExpo = async () => {
    if (!expoForm.title) return
    setSaving(true)
    try {
      const data = { ...expoForm, sectors:expoForm.sectors.split(",").map(s=>s.trim()).filter(Boolean), exhibitors:Number(expoForm.exhibitors)||0, visitors:Number(expoForm.visitors)||0, countries:Number(expoForm.countries)||0, createdAt:ts() }
      const ref = await addDoc("exhibitions",data)
      setExpos(e=>[{...data,id:ref.id},...e])
      setAddingExpo(false); setExpoForm({ title:"",subtitle:"",date:"",location:"",category:"Multi-Sector",status:"upcoming",exhibitors:0,visitors:0,countries:0,sectors:"",description:"" })
    } catch(e) { alert(e.message) }
    setSaving(false)
  }

  const approveStakeholder = async (colName, id, setter) => {
    await updateDoc(colName,id,{status:"approved",approvedAt:ts(),approvedBy:user.id}).catch(()=>{})
    setter(list=>list.map(x=>x.id===id?{...x,status:"approved"}:x))
  }

            <div className="card fu" style={{padding:24,marginBottom:20,borderColor:"rgba(255,154,26,.3)"}}>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div style={{gridColumn:"1/-1"}}><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Title *</label><input className="inp" value={expoForm.title} onChange={e=>setExpoForm(f=>({...f,title:e.target.value}))} placeholder="Expo title"/></div>
                <div><label style={{color:"#9A7540",fontSize:12,display:"block",marginBottom:5}}>Subtitle</label><input className="inp" value={expoForm.subtitle} onChange={e=>setExpoForm(f=>({...f,subtitle:e.target.value}))} placeholder="Tagline"/></div>

            <div style={{display:"flex",gap:8}}>
